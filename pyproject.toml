[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "embedded-power-profiler"
dynamic = ["version"]
description = "Turn a current/voltage log of an embedded device into an energy budget per operating state, and hand it to solar-node-sizer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = [
    "power-profiling",
    "energy-budget",
    "ina219",
    "esp32",
    "battery-life",
    "change-point-detection",
    "embedded",
    "low-power",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
# TOML state files are read with tomllib on 3.11+; tomli is the same parser for 3.10.
dependencies = ['tomli>=1.1,<3; python_version < "3.11"']

[project.optional-dependencies]
fast = ["numpy>=1.24,<3"]
dev = [
    "mypy>=1.11,<3",
    "numpy>=1.24,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
epp = "embedded_power_profiler.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/embedded-power-profiler"
Issues = "https://github.com/projectbin07-stack/embedded-power-profiler/issues"
Changelog = "https://github.com/projectbin07-stack/embedded-power-profiler/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/embedded_power_profiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/embedded_power_profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tomli", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["embedded_power_profiler"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
